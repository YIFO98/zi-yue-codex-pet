<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>月璃 宠物预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0f8;color:#372b47;font:15px system-ui;padding:32px}main{max-width:1100px;margin:auto}h1{font-size:30px;margin:0 0 8px}p{line-height:1.6;color:#71647e}.top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}.stage{width:432px;height:464px;max-width:100%;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:24px;border:1px solid #ded5e7;position:relative}.stage.dark{background:#24202e}.sprite{width:192px;height:208px;background-image:url('../../pet/yue-li/spritesheet.webp');background-repeat:no-repeat}.controls{display:grid;gap:12px;max-width:420px}select,button{font:inherit;padding:10px 14px;border:1px solid #d4c7e0;border-radius:10px;background:#fff;color:#473258;cursor:pointer}button.selected{background:#e8ddf2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(208px,1fr));gap:14px;margin-top:28px}.card{border:1px solid #e5ddeb;background:#fff;border-radius:16px;text-align:center;padding:7px}.card img{width:192px;height:208px;max-width:100%;object-fit:contain}.card p{margin:0}.qa{margin-top:28px}.qa img{max-width:100%;background:white}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px}a{color:#76509d}.mini-sprite{width:192px;height:208px;background-image:url("../../pet/yue-li/spritesheet.webp");background-repeat:no-repeat;margin:auto}</style>
<main><h1>月璃 · 御剑版</h1><p>御剑随行 · 耳机工作 · 捧莲审阅</p><div class="top"><div class="stage" id="stage"><div id="sprite" class="sprite" role="img" aria-label="月璃宠物动画"></div></div><div class="controls"><label for="mode">选择动作</label><select id="mode"><option value="0">坐姿待机</option><option value="1">向右御剑</option><option value="2">向左御剑</option><option value="3">轻轻招手</option><option value="4">举星停留</option><option value="5">失落</option><option value="6">等待回应</option><option value="7">专注工作</option><option value="8">检查成果</option><option value="9">视线环绕</option></select><div><button id="play">暂停</button> <button id="simulate">模拟悬停（3轮）</button> <button id="prev">上一帧</button> <button id="next">下一帧</button> <button id="theme">深色背景</button> <button id="pointer">跟随指针</button> <button id="zoom">放大 2 倍</button></div><label for="speed">播放速度</label><select id="speed"><option value="1">原速</option><option value="0.65">0.65 倍（仅预览）</option><option value="0.5">0.5 倍（仅预览）</option></select><p id="readout" aria-live="off"></p><p>此页循环展示所选动作，方便逐帧检查。点击“模拟悬停”会按当前客户端规则播放三轮，再回到慢速待机。举星保持三帧，共 420 毫秒；慢放仅影响预览。</p></div></div><section class="qa"><h2>只做 A · 举星停留</h2><p>一轮仍为客户端固定的 0.84 秒，其中 0.42 秒保持举星姿势。下面展示当前动作：按原速连播三轮，再回到待机。</p><img src="hover-hold.gif" alt="当前举星停留动作，原速播放三轮后回到待机"><img src="hold-five-stills.png" alt="准备、举星、保持、继续保持、收回五帧"></section><div class="grid"><div class="card"><p>坐姿待机</p><div class="mini-sprite" data-row="0" role="img" aria-label="坐姿待机动画" style="background-position:0 -0px"></div></div><div class="card"><p>向右御剑</p><div class="mini-sprite" data-row="1" role="img" aria-label="向右御剑动画" style="background-position:0 -208px"></div></div><div class="card"><p>向左御剑</p><div class="mini-sprite" data-row="2" role="img" aria-label="向左御剑动画" style="background-position:0 -416px"></div></div><div class="card"><p>轻轻招手</p><div class="mini-sprite" data-row="3" role="img" aria-label="轻轻招手动画" style="background-position:0 -624px"></div></div><div class="card"><p>举星停留</p><div class="mini-sprite" data-row="4" role="img" aria-label="举星停留动画" style="background-position:0 -832px"></div></div><div class="card"><p>失落</p><div class="mini-sprite" data-row="5" role="img" aria-label="失落动画" style="background-position:0 -1040px"></div></div><div class="card"><p>等待回应</p><div class="mini-sprite" data-row="6" role="img" aria-label="等待回应动画" style="background-position:0 -1248px"></div></div><div class="card"><p>专注工作</p><div class="mini-sprite" data-row="7" role="img" aria-label="专注工作动画" style="background-position:0 -1456px"></div></div><div class="card"><p>检查成果</p><div class="mini-sprite" data-row="8" role="img" aria-label="检查成果动画" style="background-position:0 -1664px"></div></div></div><div class="qa"><h2>六帧动作记录</h2><img src="yueli-motion-stills.png" alt="坐姿、御剑、招手、庆祝、工作、检查六帧"><h2>十六个视线方向</h2><img src="yueli-directions.png" alt="十六方向与正常待机的对照图"></div><div class="links"><a href="yueli-all-states.mp4">完整 MP4</a><a href="yueli-all-states.gif">完整 GIF</a><a href="../../pet/yue-li/spritesheet.webp">宠物精灵图 WebP</a></div></main>
<script>const durations=[[1680, 660, 660, 840, 840, 1920], [120, 120, 120, 120, 120, 120, 120, 220], [120, 120, 120, 120, 120, 120, 120, 220], [140, 140, 140, 280], [140, 140, 140, 140, 280], [140, 140, 140, 140, 140, 140, 140, 240], [150, 150, 150, 150, 150, 260], [120, 120, 120, 120, 120, 220], [150, 150, 150, 150, 150, 280]];const names=["坐姿待机", "向右御剑", "向左御剑", "轻轻招手", "举星停留", "失落", "等待回应", "专注工作", "检查成果"];const degrees=["000", "022.5", "045", "067.5", "090", "112.5", "135", "157.5", "180", "202.5", "225", "247.5", "270", "292.5", "315", "337.5"];const sprite=document.querySelector('#sprite'),mode=document.querySelector('#mode'),play=document.querySelector('#play'),stage=document.querySelector('#stage'),readout=document.querySelector('#readout');let chosen=0,index=0,last=performance.now(),paused=false,follow=false,speed=1,runtimeHover=false,hoverLoops=0;const miniStates=[...document.querySelectorAll(".mini-sprite")].map(el=>({el,row:Number(el.dataset.row),frame:0,last:performance.now()}));function draw(row,col,label){sprite.style.backgroundPosition=`-${col*192}px -${row*208}px`;readout.textContent=label}function frame(){if(chosen===9)draw(9+Math.floor(index/8),index%8,'视线 '+degrees[index]+'°');else draw(chosen,index,names[chosen]+' · 第 '+(index+1)+' 帧'+(runtimeHover?' · 第 '+(hoverLoops+1)+'/3 轮':''))}function tick(now){if(!paused){for(const m of miniStates){if(now-m.last>=durations[m.row][m.frame]/speed){m.frame=(m.frame+1)%durations[m.row].length;m.last=now;m.el.style.backgroundPosition=`-${m.frame*192}px -${m.row*208}px`}}}if(!paused&&!follow){let d=chosen===9?220:durations[chosen][index];if(now-last>=d/speed){index++;if(index>=(chosen===9?16:durations[chosen].length)){index=0;if(runtimeHover&&chosen===4){hoverLoops++;if(hoverLoops>=3){runtimeHover=false;chosen=0;mode.value='0'}}}last=now;frame()}}requestAnimationFrame(tick)}mode.onchange=()=>{runtimeHover=false;chosen=Number(mode.value);index=0;last=performance.now();follow=false;document.querySelector('#pointer').classList.remove('selected');frame()};function toggle(){paused=!paused;play.textContent=paused?'播放':'暂停'}play.onclick=toggle;const step=delta=>{runtimeHover=false;paused=true;follow=false;play.textContent="播放";document.querySelector("#pointer").classList.remove("selected");index=(index+delta+(chosen===9?16:durations[chosen].length))%(chosen===9?16:durations[chosen].length);frame()};document.querySelector("#prev").onclick=()=>step(-1);document.querySelector("#next").onclick=()=>step(1);document.querySelector("#speed").onchange=e=>{speed=Number(e.target.value);last=performance.now();miniStates.forEach(m=>m.last=last)};document.querySelector("#zoom").onclick=e=>{const on=sprite.style.transform!=="scale(2)";sprite.style.transform=on?"scale(2)":"";e.target.textContent=on?"恢复原尺寸":"放大 2 倍"};stage.onclick=toggle;document.querySelector('#theme').onclick=e=>{stage.classList.toggle('dark');e.target.textContent=stage.classList.contains('dark')?'浅色背景':'深色背景'};document.querySelector('#pointer').onclick=e=>{follow=!follow;e.target.classList.toggle('selected',follow);if(!follow)frame()};stage.onpointermove=e=>{if(!follow)return;let r=stage.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<20){draw(0,0,'正面待机');return}let angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,i=Math.round(angle/22.5)%16;draw(9+Math.floor(i/8),i%8,'视线 '+degrees[i]+'°')};document.querySelector('#simulate').onclick=()=>{runtimeHover=true;hoverLoops=0;chosen=4;mode.value='4';index=0;last=performance.now();paused=false;follow=false;play.textContent='暂停';document.querySelector('#pointer').classList.remove('selected');frame()};frame();requestAnimationFrame(tick);</script></html>
